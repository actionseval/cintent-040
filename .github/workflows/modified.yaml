name: CI

# CINTENT >> MANUAL_TRIGGER
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]
#   # Allow rebuilds via API.
#   repository_dispatch:
#     types: rebuild
on: [repository_dispatch, workflow_dispatch]

env:
  CACHE_NUMBER: 0  # increase to reset cache manually

concurrency:
  group: run_tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
            prefix: /usr/share/miniconda3/envs/my-env

          #- os: macos-latest
          #  label: osx-64
          #  prefix: /Users/runner/miniconda3/envs/my-env

          #- os: windows-latest
          #  label: win-64
          #  prefix: C:\Miniconda3\envs\my-env

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      # CINTENT >> CHANGE_VERSION
      # - uses: actions/checkout@v2
      - uses: actions/checkout@v4

      - name: Cache MFA models
        uses: actions/cache@v3
        env:
          cache-name: cache-mfa-models
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
          path: |
            ~/Documents/MFA

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-variant: Mambaforge
          miniforge-version: latest
          activate-environment: my-env
          use-mamba: true
          
      # - name: Set cache date
      #   run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # - uses: actions/cache@v3
      #   with:
      #     path: ${{ matrix.prefix }}
      #     key: ${{ matrix.label }}-conda-${{ hashFiles('environment.yml') }}-${{ env.DATE }}-${{ env.CACHE_NUMBER }}
      #   id: cache

      # CINTENT >> INSERT_CINTENT
      - uses: JavidDitty/setup-cintent@e3d420b9a40765f278d3651507e812014bfc7407

      - name: Update environment
        run: mamba env update -n my-env -f environment.yml
        # if: steps.cache.outputs.cache-hit != 'true'

      - name: Run tests
        # shell: bash -l {0}
        run: pytest -x ./tests

      # CINTENT >> REMOVE_UPLOADS
      # - name: "Upload coverage to Codecov"
      #   uses: "codecov/codecov-action@v3"
      #   with:
      #     file: ./coverage.xml
      #     fail_ci_if_error: false

      # CINTENT >> INSERT_CINTENT
      - name: Upload CIntent Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CINTENT_ARTIFACT_NAME }}
          path: ${{ env.CINTENT_LOGS }}
